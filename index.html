<style>
/* Layout: phone-first app — sticky header with zone chips, scrolling cards, fixed bottom tab bar */
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --sunk:#ECE8DF; --ink:#22302A; --muted:#5E6B63; --line:#DAD5C9;
  --green:#2E8F5E; --orange:#C46A00; --pink:#D3237F; --info:#2E7D9A;
  --zB:#9DB8C4; --zBt:#E3EDF1; --zBd:#1F6F8B;
  --zC:#E5A08B; --zCt:#F8E4DB; --zCd:#B5483A;
  --zD:#DDAA4F; --zDt:#F6EDCF; --zDd:#8A5E0C;
  --zE:#A8B5A0; --zEt:#E3EADF; --zEd:#3D6B3A;
  --zA:#B8C4BD; --zAt:#E7ECE9; --zAd:#3a4a3e;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}

  --green:#4CC489; --orange:#F0A24A; --pink:#F06BAF; --info:#6BB8D6;

:root[data-theme="dark"]{

  --zB:#5E8597; --zBt:#22323A; --zBd:#9DD0E4;
  --zC:#B06A55; --zCt:#3A2722; --zCd:#F2A694;
  --zD:#A87B2C; --zDt:#352C18; --zDd:#F0C873;
  --zE:#6E8064; --zEt:#26302A; --zEd:#A9D2A0;
  --zA:#6C7A72; --zAt:#28302C; --zAd:#C6D2CB; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font)}
body{font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand{font-weight:900;font-size:17px;letter-spacing:.02em}
.brand small{font-weight:500;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:6px 14px;font:700 13px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.z{min-width:44px}
h2{font-size:20px;font-weight:900;margin:14px 0 8px;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);vertical-align:middle}
/* timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
.slot .t{font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;padding-top:10px;text-align:right}
.slot .b{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.slot.now .b{border:2px solid var(--green)}
.slot.now .t{color:var(--green)}
.row{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.row+.row{border-top:1px dashed var(--line);margin-top:3px;padding-top:6px}
.zb{flex:0 0 auto;width:26px;height:22px;border-radius:7px;font-weight:900;font-size:12px;display:grid;place-items:center;color:var(--ink)}
.zbB{background:var(--zB)}.zbC{background:var(--zC)}.zbD{background:var(--zD)}.zbE{background:var(--zE)}.zbA{background:var(--zA)}
.row .x{min-width:0;font-size:14px}
.nowbtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--green);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:700 14px var(--font);box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
/* zone */
.zhead{border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.zhead .zn{font-size:34px;font-weight:900;line-height:1}
.zhead .zp{font-size:12.5px;font-weight:700}
.lead{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.person{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:2px}
.person .n{font-weight:700;font-size:15.5px}
.person .n .star{color:var(--pink);margin-right:2px}
.person .h{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;align-self:center}
.person .r{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.loc{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:2px}
.mv{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-radius:12px;padding:9px 12px;border:1px solid var(--line);background:var(--surface)}
.mv .t{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--muted);min-width:78px;padding-top:2px}
.mv .d{font-size:14px;font-weight:500;min-width:0}
.mv.g{border-left:5px solid var(--green)}
.mv.k{border-left:5px solid var(--orange);background:color-mix(in srgb,var(--orange) 9%,var(--surface))}
.mv.k .t{color:var(--orange)}
.sp{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--pink) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--pink) 35%,var(--line));display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.sp .t{font-size:12px;font-weight:700;color:var(--pink);font-variant-numeric:tabular-nums}
.sp .d{grid-column:1;font-size:14px;font-weight:500}
.sp .w{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;font-weight:700;background:var(--surface);color:var(--pink);border-radius:999px;padding:4px 10px;border:1px solid color-mix(in srgb,var(--pink) 40%,var(--line))}
.note{font-size:13px;font-weight:700;border-radius:10px;padding:8px 12px}
.maps{display:flex;flex-direction:column;gap:12px}
.map figure{margin:0}
.map img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.map figcaption{font-size:12.5px;font-weight:700;margin:4px 2px 0}

.search{width:100%;font:500 16px var(--font);padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.plist .p{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plist .p:first-child{border-top:0}
.plist .zb{width:30px;height:30px;border-radius:9px;font-size:14px}
.plist .nm{font-weight:700}
.plist .nm small{font-weight:500;font-size:11.5px;color:var(--muted);margin-left:6px}
.plist .mm{font-size:12.5px;color:var(--muted)}
.role{display:flex;flex-direction:column;gap:2px}
.role .k{font-size:12px;font-weight:700;color:var(--green)}
.role .who{font-weight:900;font-size:16px}
.role .m{font-size:13px;color:var(--muted)}
/* teardown */
.td .slot .b .row .x{font-size:13.5px}
.tdhead{font-size:13px;font-weight:700;color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--surface));border-radius:10px;padding:8px 12px}
/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--muted);font:700 11px var(--font);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--green)}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.92);overflow:auto;-webkit-overflow-scrolling:touch}
.lb img{display:block;width:220%;max-width:none;height:auto;margin:calc(56px + env(safe-area-inset-top,0px)) 0 24px}
.lb .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:51;background:#fff;color:#111;border:0;border-radius:999px;padding:8px 16px;font:700 14px var(--font)}
.lb .hint{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));color:#ddd;font-size:12px}
.foot{font-size:11.5px;color:var(--muted);margin-top:22px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
</head>

const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t); return m ? (+m[1]) * 60 + (+m[2]) : null; };
function currentSlot(list) {
  const n = new Date();
  const isDay = n.getFullYear() === 2026 && n.getMonth() === 10 && n.getDate() === 21;
  if (!isDay) return -1;
  const cur = n.getHours() * 60 + n.getMinutes(); let idx = -1;
  list.forEach((r, i) => { const m = toMin(r[0]); if (m !== null && m <= cur) idx = i; });
  return idx;
}

  view = v;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v ? "page" : "false"));
  R[v](); window.scrollTo(0, 0);
  if (push && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.v, true); });
$("#zchips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.k === "zt") { zoneTab = b.dataset.v; try { localStorage.setItem("zt", zoneTab); } catch(_) {} }
  else { zoneSel = b.dataset.v; try { localStorage.setItem("zs", zoneSel); } catch(_) {} }
  R[view](); window.scrollTo(0, 0);
});
$("#nowbtn").addEventListener("click", () => { const el = document.querySelector(".slot.now"); if (el) el.scrollIntoView({behavior: "smooth", block: "center"}); });
document.addEventListener("click", e => {
  const img = e.target.closest(".map img"); if (!img) return;
  const lb = document.createElement("div"); lb.className = "lb";
  lb.innerHTML = `<span class="hint">左右にスクロールで見る</span><button class="close">閉じる</button><img src="${img.dataset.full}" alt="${img.alt}">`;
  document.body.appendChild(lb); document.body.style.overflow = "hidden";
  lb.querySelector(".close").addEventListener("click", () => { lb.remove(); document.body.style.overflow = ""; });
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (R[v] && v !== view) go(v, false); });
tick(); setInterval(() => { tick(); }, 30000);
const start = location.hash.slice(1);
go(R[start] ? start : "time", false);
</script>
